<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habits">
<title>Habits</title>
<script>
try { document.documentElement.dataset.theme = localStorage.getItem('habits-theme') || 'light'; }
catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="view"></main>
<nav id="tabs">
  <button data-tab="today"><span>☀️</span>Today</button>
  <button data-tab="adhkar"><span>📿</span>Adhkar</button>
  <button data-tab="weight"><span>⚖️</span>Weight</button>
  <button data-tab="progress"><span>📈</span>Progress</button>
  <button data-tab="settings"><span>⚙️</span>Settings</button>
</nav>
<script src="adhkar.js"></script>
<script src="prayertimes.js"></script>
<script src="app.js"></script>

</html>
